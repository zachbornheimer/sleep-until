# Only what is specific to this repo. setup, scan, ci, and the doctor/lint/test/build
# contract come from the profile root; the tasks below extend it with the Rust steps.
[tools]
rust = { version = "1.98.1", components = "clippy,rustfmt" }

# `mise install` provisions the toolchain, then installs the `slp` binary.
[hooks]
postinstall = "mise run install"

[tasks.fmt]
description = "Format source"
run = ["dprint fmt", "cargo fmt --all"]

[tasks.lint]
description = "Format check and clippy (warnings are errors)"
depends = ["profile:lint"]
run = ["cargo fmt --all -- --check", "cargo clippy --locked --all-targets -- -D warnings"]

[tasks.test]
description = "Unit, workflow, adapter, architecture, and public-binary tests"
depends = ["profile:test"]
run = "cargo test --locked"

[tasks.build]
description = "Build the release binary"
depends = ["profile:build"]
run = "cargo build --release --locked"

[tasks.doctor]
description = "Profile contract plus a native-toolchain check"
depends = ["profile:doctor", "toolchain:native"]

[tasks.install]
description = "Install slp into $SLP_INSTALL_ROOT/bin (default ~/.local/bin)"
run = 'cargo install --path . --locked --force --root "${SLP_INSTALL_ROOT:-$HOME/.local}"'
